<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pekman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Background Logo/Header -->
        <div id="logo-container">
            <img src="assets/top_logo.png" alt="Pekfood Logo" id="top-logo">
        </div>

        <!-- Canvas Game Layer -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer (Timer, Score) -->
        <div id="hud">
            <div id="timer">15</div>
        </div>
        <div id="score-bar-container">
            <div id="score-bar"></div>
        </div>

        <!-- Interactive UI Screens -->
        <div id="start-screen" class="screen active">
            <h1>Pekman</h1>
            <button class="btn" id="start-btn">Oynamak İçin Tıkla</button>
        </div>

        <div id="end-screen" class="screen">
            <img src="assets/final_logo.png" alt="Pekfood Final Logo" id="final-logo">
            <p class="slogan">Pek Bi' ENFES</p>
            <button class="btn" id="visit-btn">HİKAYEMİZ</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
